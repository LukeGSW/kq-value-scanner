# ============================================================================
# KQ Value Scanner · Weekly fundamentals pipeline
# ----------------------------------------------------------------------------
# Scope: aggiornamento settimanale dei fundamentals (snapshot + storico finanziario)
# + ricalcolo di tutte le metriche derivate (cash/debt, profitability, valuation,
# scores, seasonality) + rigenerazione dei JSON.
#
# Frequenza: domenica 06:00 UTC (weekend, meno pressione sui credits EODHD).
# Manuale: workflow_dispatch con `mode` (incremental|full) e `exchange`.
# ============================================================================
name: Weekly fundamentals

on:
  schedule:
    - cron: "0 6 * * 0"   # ogni domenica 06:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Fetch mode (incremental|full)"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
      exchange:
        description: "Exchange filter (es. US, LSE, XETRA). Vuoto = tutti."
        required: false
        default: ""
        type: string

# Nessuna sovrapposizione con la pipeline notturna dei prezzi.
concurrency:
  group: kq-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fundamentals:
    name: Fetch fundamentals · compute all · rebuild JSON
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      PYTHONUNBUFFERED: "1"
      TZ: "UTC"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure storage/site dirs
        run: |
          mkdir -p pipeline/storage/db docs/data docs/data/tickers _restored

      # --------------------------------------------------------------
      # Restore SQLite dal RUN PRECEDENTE con `gh` CLI (nome artifact
      # fisso = `kq-fundamentals-db`). Affidabile al 100%: usa l'API
      # GitHub nativa, niente regex magica, niente filtri sui conclusion
      # che non matchano run falliti.
      # --------------------------------------------------------------
      - name: Restore DB from previous artifact (gh CLI)
        id: restore_db
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -u
          echo "=== Cerca ultimo run (qualsiasi conclusion) con artifact 'kq-fundamentals-db' ==="
          # Lista ultimi 30 run del workflow, escludi quello corrente, prendi il più recente
          # che abbia un artifact chiamato 'kq-fundamentals-db'.
          PREV_RUN_ID=""
          for RID in $(gh run list --workflow=weekly-fundamentals.yml --limit=30 \
                         --json databaseId --jq '.[].databaseId'); do
            if [[ "$RID" == "$CURRENT_RUN" ]]; then continue; fi
            if gh api "repos/$REPO/actions/runs/$RID/artifacts" \
                 --jq '.artifacts[] | select(.expired == false) | .name' 2>/dev/null \
                 | grep -qx "kq-fundamentals-db"; then
              PREV_RUN_ID="$RID"
              echo "→ Trovato run $RID con artifact 'kq-fundamentals-db'"
              break
            fi
          done

          if [[ -z "$PREV_RUN_ID" ]]; then
            echo "Nessun artifact 'kq-fundamentals-db' trovato nei run precedenti."
            echo "  (primo run con questa strategia, oppure artifact scaduti)"
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "=== Download artifact dal run $PREV_RUN_ID ==="
          gh run download "$PREV_RUN_ID" --name kq-fundamentals-db --dir ./_restored

          echo "=== Struttura scaricata ==="
          find ./_restored -type f | head -20

          # Prova vari layout possibili (path preservato / flat)
          if [[ -f ./_restored/pipeline/storage/db/kq_scanner.db ]]; then
            mv ./_restored/pipeline/storage/db/kq_scanner.db \
               pipeline/storage/db/kq_scanner.db
          elif [[ -f ./_restored/kq_scanner.db ]]; then
            mv ./_restored/kq_scanner.db pipeline/storage/db/kq_scanner.db
          else
            FOUND=$(find ./_restored -name 'kq_scanner.db' -type f | head -1)
            if [[ -n "$FOUND" ]]; then
              mv "$FOUND" pipeline/storage/db/kq_scanner.db
            fi
          fi

          if [[ -f pipeline/storage/db/kq_scanner.db ]]; then
            echo "DB ripristinato (size: $(stat -c%s pipeline/storage/db/kq_scanner.db) bytes)"
            python - <<'PY'
          import sqlite3
          c = sqlite3.connect("pipeline/storage/db/kq_scanner.db")
          for t in ["universe", "fundamentals_snapshot", "computed_metrics", "prices_daily"]:
              try:
                  n = c.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                  print(f"  {t}: {n}")
              except Exception as e:
                  print(f"  {t}: (missing) {e}")
          PY
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "Artifact scaricato ma kq_scanner.db non trovato nei path attesi."
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------------------
      # 1) Universe · in weekly mode ricostruiamo sempre
      # --------------------------------------------------------------
      - name: Rebuild universe
        env:
          EXCH: ${{ github.event.inputs.exchange || '' }}
        run: |
          ARGS="-v"
          if [[ -n "$EXCH" ]]; then ARGS="$ARGS --exchange $EXCH"; fi
          echo "Running: python -m pipeline.fetch.fetch_universe $ARGS"
          python -m pipeline.fetch.fetch_universe $ARGS

      # --------------------------------------------------------------
      # 1b) Init SQLite schema + import universo nel DB
      #     (genera storage/kq.sqlite se non presente e popola tabella
      #      `universe` leggendo storage/universe.parquet)
      # --------------------------------------------------------------
      - name: Init SQLite schema + load universe
        run: |
          python -m pipeline.storage.db --init --load-universe --stats

      # --------------------------------------------------------------
      # 2) Fetch fundamentals — modalità per-ticker (endpoint single
      #    `fundamentals/{ticker}`), compatibile con piano All-In-One /
      #    Fundamentals Data Feed. L'endpoint bulk richiede Extended
      #    Fundamentals Plan che non usiamo.
      # --------------------------------------------------------------
      - name: Fetch fundamentals (per-ticker)
        env:
          EXCH: ${{ github.event.inputs.exchange || '' }}
        run: |
          ARGS="--per-ticker -v"
          if [[ -n "$EXCH" ]]; then ARGS="$ARGS --exchange $EXCH"; fi
          echo "Running: python -m pipeline.fetch.fetch_fundamentals $ARGS"
          python -m pipeline.fetch.fetch_fundamentals $ARGS

      # --------------------------------------------------------------
      # 3) Ricalcolo COMPLETO di tutte le metriche derivate.
      #    (tech + cash/debt + profitability + valuation + scores +
      #     seasonality, orchestrato da compute.screener)
      # --------------------------------------------------------------
      - name: Compute all derived metrics
        run: |
          python -m pipeline.compute.screener -v

      # --------------------------------------------------------------
      # 4) Rigenera JSON screener + per-ticker (tutti)
      # --------------------------------------------------------------
      - name: Rebuild screener.json
        run: |
          python -m pipeline.generate.build_screener_json \
            --output docs/data/screener.json --minify

      - name: Rebuild per-ticker JSON pages (full)
        run: |
          python -m pipeline.generate.build_ticker_pages \
            --output-dir docs/data/tickers --minify

      # --------------------------------------------------------------
      # 5) Commit & push JSON aggiornati
      # --------------------------------------------------------------
      - name: Commit updated JSON
        run: |
          git config user.name  "kq-bot"
          git config user.email "kq-bot@users.noreply.github.com"
          git add docs/data/screener.json docs/data/tickers/
          if git diff --cached --quiet; then
            echo "Nessun cambiamento nei JSON · nulla da committare"
          else
            TS=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore(data): weekly fundamentals refresh · $TS"
            git push
          fi

      # --------------------------------------------------------------
      # 6) Report artifacts
      # --------------------------------------------------------------
      - name: Export fetch_log summary
        if: always()
        run: |
          python - <<'PY'
          import sqlite3, os, json, pathlib
          db = "pipeline/storage/db/kq_scanner.db"
          if not os.path.exists(db):
              print("DB missing, skip"); raise SystemExit(0)
          con = sqlite3.connect(db)
          rows = con.execute(
              "SELECT * FROM fetch_log ORDER BY ts_utc DESC LIMIT 40"
          ).fetchall()
          cols = [c[0] for c in con.execute("SELECT * FROM fetch_log LIMIT 0").description]
          out = [dict(zip(cols,r)) for r in rows]
          pathlib.Path("fetch_log_tail.json").write_text(json.dumps(out,default=str,indent=2))
          print(f"Exported {len(out)} rows")
          PY

      # Nome artifact FISSO: è l'unica fonte di persistenza DB tra run.
      # `overwrite: true` permette a più run di sostituire lo stesso artifact.
      - name: Upload DB artifact (stable name)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kq-fundamentals-db
          path: |
            fetch_log_tail.json
            pipeline/storage/db/kq_scanner.db
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
